name: Build VoxSynth DD-6 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Install Capacitor & Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/filesystem @capacitor/share @capacitor/haptics @capacitor-community/keep-awake
          npx cap add android || true
          npx cap sync android

      - name: Configure Android audio & Bluetooth permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            const file = process.env.MANIFEST;
            let xml = fs.readFileSync(file, "utf8");
            const perms = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.WAKE_LOCK"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", `    <uses-permission android:name="${p}" />\n    <application`);
              }
            }
            fs.writeFileSync(file, xml);
          '
        env:
          MANIFEST: android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload VoxSynth DD-6 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxSynth-DD6-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
